version: '3.8'

services:
  goesproc:
    build: .
    image: goesproc:latest
    container_name: goesproc
    volumes:
      - ./data:/data
      - ./config:/config
      - ./output:/output
    working_dir: /data
    command: ["goesproc", "-c", "/config/goesproc.conf", "-m", "packet", "--subscribe", "tcp://10.0.5.104:5004"]
    restart: unless-stopped

  uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: goesproc-uploader
    volumes:
      - ./data/goes19:/output:ro  # Read-only access to goesproc goes19 output
      - ./scripts:/scripts:ro
      - ./logs:/logs  # For upload logs
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - BUCKET_NAME=${BUCKET_NAME:-goes-19}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-900}  # 15 minutes in seconds
    depends_on:
      - goesproc
    restart: unless-stopped
    command: |
      sh -c "
        echo 'Configuring MinIO client...' &&
        mc alias set minio http://\$${MINIO_ENDPOINT} \$${MINIO_ACCESS_KEY} \$${MINIO_SECRET_KEY} &&
        echo 'Starting upload loop...' &&
        while true; do
          echo \"\$(date): Starting upload cycle\" >> /logs/upload.log
          /scripts/upload.sh >> /logs/upload.log 2>&1
          echo \"\$(date): Upload cycle completed, sleeping for \$${UPLOAD_INTERVAL} seconds\" >> /logs/upload.log
          sleep \$${UPLOAD_INTERVAL}
        done
      "

  emwin-uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: goesproc-emwin-uploader
    volumes:
      - ./data/emwin:/emwin:ro  # Read-only access to emwin data
      - ./scripts:/scripts:ro
      - ./logs:/logs  # For upload logs
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - EMWIN_BUCKET_NAME=${EMWIN_BUCKET_NAME:-goes-19-emwin}
      - UPLOAD_INTERVAL=${EMWIN_UPLOAD_INTERVAL:-900}  # 15 minutes in seconds
    restart: unless-stopped
    command: |
      sh -c "
        echo 'Configuring MinIO client for EMWIN...' &&
        mc alias set minio http://\$${MINIO_ENDPOINT} \$${MINIO_ACCESS_KEY} \$${MINIO_SECRET_KEY} &&
        echo 'Starting EMWIN upload loop...' &&
        while true; do
          echo \"\$(date): Starting EMWIN upload cycle\" >> /logs/emwin-upload.log
          /scripts/upload-emwin.sh >> /logs/emwin-upload.log 2>&1
          echo \"\$(date): EMWIN upload cycle completed, sleeping for \$${UPLOAD_INTERVAL} seconds\" >> /logs/emwin-upload.log
          sleep \$${UPLOAD_INTERVAL}
        done
      "