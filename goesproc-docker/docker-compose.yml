version: '3.8'

services:
  goesproc:
    build: .
    image: goesproc:latest
    container_name: goesproc
    volumes:
      - ./data:/data
      - ./config:/config
      - ./output:/output
    working_dir: /data
    command: ["goesproc", "-c", "/config/goesproc.conf", "-m", "packet", "--subscribe", "tcp://10.0.5.104:5004"]
    restart: unless-stopped

  goesproc-watchdog:
    image: alpine:3.20
    container_name: goesproc-watchdog
    restart: unless-stopped
    environment:
      TARGET_HOST: "10.0.4.105"
      TARGET_PORT: "5004"
      CHECK_INTERVAL: "15"         # seconds between checks
      UP_STREAK: "2"               # require N consecutive successes before “recovered”
      DOWN_STREAK: "3"             # require N consecutive failures before “down”
      SERVICE_NAME: "goesproc"     # docker container name to restart
      COOLDOWN_SEC: "30"           # minimum time between restarts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh","-lc"]
    command: >
      apk add --no-cache docker-cli netcat-openbsd &&
      cat >/usr/local/bin/watch.sh <<'SH'
      #!/bin/sh
      set -eu

      host="${TARGET_HOST:?set TARGET_HOST}"
      port="${TARGET_PORT:?set TARGET_PORT}"
      interval="${CHECK_INTERVAL:-5}"
      up_need="${UP_STREAK:-2}"
      down_need="${DOWN_STREAK:-3}"
      svc="${SERVICE_NAME:-goesproc}"
      cooldown="${COOLDOWN_SEC:-30}"

      consec_up=0
      consec_down=0
      was_down=0           # flip to 1 once we've confirmed a down state
      last_restart=0

      log() { echo "[watchdog] $*"; }

      while :; do
        if nc -z -w2 "$host" "$port" >/dev/null 2>&1; then
          consec_up=$((consec_up+1))
          consec_down=0
          if [ "$was_down" -eq 1 ] && [ "$consec_up" -ge "$up_need" ]; then
            now=$(date +%s)
            if [ $((now - last_restart)) -ge "$cooldown" ]; then
              log "target ${host}:${port} recovered (up ${consec_up}x) → restarting ${svc}"
              docker restart "$svc" >/dev/null 2>&1 || log "restart failed"
              last_restart="$now"
            else
              log "recovered but in cooldown; skipping restart"
            fi
            was_down=0
          fi
        else
          consec_down=$((consec_down+1))
          consec_up=0
          if [ "$consec_down" -ge "$down_need" ]; then
            if [ "$was_down" -eq 0 ]; then
              log "target ${host}:${port} considered DOWN (fail ${consec_down}x)"
            fi
            was_down=1
          fi
        fi
        sleep "$interval"
      done
      SH
      chmod +x /usr/local/bin/watch.sh
      exec /usr/local/bin/watch.sh

  uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: goesproc-uploader
    volumes:
      - ./data:/data  # Read-write access needed for EMWIN preprocessing
      - ./scripts:/scripts:ro
      - ./logs:/logs  # For upload logs
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - BUCKET_NAME=${BUCKET_NAME:-goes-data}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-300}  # 5 minutes in seconds
    depends_on:
      - goesproc
    restart: unless-stopped
    command: |
      sh -c "
        echo 'Configuring MinIO client...' &&
        mc alias set minio http://\$${MINIO_ENDPOINT} \$${MINIO_ACCESS_KEY} \$${MINIO_SECRET_KEY} &&
        echo 'Starting upload loop...' &&
        while true; do
          echo \"\$(date): Starting upload cycle\" >> /logs/upload.log
          /scripts/upload-optimized.sh >> /logs/upload.log 2>&1
          echo \"\$(date): Upload cycle completed, sleeping for \$${UPLOAD_INTERVAL} seconds\" >> /logs/upload.log
          sleep \$${UPLOAD_INTERVAL}
        done
      "