version: '3.8'

services:
  goesproc:
    build: .
    image: goesproc:latest
    container_name: goesproc
    volumes:
      - ./data:/data
      - ./config:/config
      - ./output:/output
    working_dir: /data
    # Override `command` in docker-compose.override.yml to point at your Pi's IP.
    command: ["goesproc", "-c", "/config/goesproc.conf", "-m", "packet", "--subscribe", "tcp://pi.local:5004"]
    restart: unless-stopped

  goesproc-watchdog:
    image: alpine:3.20
    container_name: goesproc-watchdog
    restart: unless-stopped
    environment:
      # Override TARGET_HOST in docker-compose.override.yml to point at your Pi's IP.
      TARGET_HOST: "pi.local"
      TARGET_PORT: "5004"
      CHECK_INTERVAL: "15"         # seconds between checks
      UP_STREAK: "2"               # require N consecutive successes before “recovered”
      DOWN_STREAK: "3"             # require N consecutive failures before “down”
      SERVICE_NAME: "goesproc"     # docker container name to restart
      COOLDOWN_SEC: "30"           # minimum time between restarts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/watch.sh:/usr/local/bin/watch.sh:ro
    command: ["sh", "/usr/local/bin/watch.sh"]

  uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    container_name: goesproc-uploader
    volumes:
      - ./data:/data  # Read-write access needed for EMWIN preprocessing
      - ./scripts:/scripts:ro
      - ./logs:/logs  # For upload logs
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT:-localhost:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-rustfsadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-rustfsadmin}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_REGION=${S3_REGION:-us-east-1}
      - BUCKET_NAME=${BUCKET_NAME:-goes-data}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-300}  # 5 minutes in seconds
    depends_on:
      - goesproc
    restart: unless-stopped
    command: |
      sh -c "
        echo 'Starting upload loop...' &&
        while true; do
          echo \"\$(date): Starting upload cycle\" >> /logs/upload.log
          /scripts/upload.sh >> /logs/upload.log 2>&1
          echo \"\$(date): Upload cycle completed, sleeping for \$${UPLOAD_INTERVAL} seconds\" >> /logs/upload.log
          sleep \$${UPLOAD_INTERVAL}
        done
      "